<!doctype html>
<html lang="ru" style="background:#15191e;color-scheme:dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#15191e"><title>Skladka · Cloth Studio</title><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="manifest" href="./manifest.webmanifest">
<meta name="description" content="Interactive 3D cloth studio: folds, garments and draping.">
<style>
html,body{margin:0;background:#15191e}#boot{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;background:#15191e;color:#dce0e3;font:700 12px/1.6 system-ui,sans-serif;letter-spacing:.14em;text-align:center}#boot[hidden]{display:none}#boot svg{display:block;margin:0 auto 24px;color:#cba673}#boot h1{font-size:15px;letter-spacing:.24em;margin:0 0 12px}#boot-message{max-width:320px;padding:0 24px;color:#9ca6af;font-size:10px;letter-spacing:.09em}#boot-retry{margin-top:20px;padding:10px 18px;border:1px solid #56606a;background:none;color:#dce0e3;font:inherit;cursor:pointer}#boot-retry[hidden]{display:none}
</style>
</head>
<body>
<div id="boot" role="status" aria-live="polite"><div>
<svg width="56" height="56" viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m9 15 13-5 12 5 13-5v31l-13 5-12-5-13 5Zm13-5v31m12-26v31"/></svg>
<h1>SKLADKA</h1><div id="boot-message">ЗАГРУЗКА СЦЕНЫ</div><button id="boot-retry" type="button" hidden>ПОВТОРИТЬ</button>
<noscript><p>ДЛЯ РАБОТЫ НУЖЕН JAVASCRIPT</p></noscript>
</div></div>
<div id="root"></div>
<script>
(()=>{const panel=document.getElementById('boot'),message=document.getElementById('boot-message'),retry=document.getElementById('boot-retry');let ready=false;
let en=false;try{en=localStorage.getItem('skladka-language')==='en';}catch{}
document.documentElement.lang=en?'en':'ru';
const words={'ЗАГРУЗКА СЦЕНЫ':'LOADING SCENE','ПОВТОРИТЬ':'RETRY','ЗАГРУЗКА ЗАНИМАЕТ БОЛЬШЕ ВРЕМЕНИ, ЧЕМ ОБЫЧНО':'LOADING IS TAKING LONGER THAN USUAL','НЕ УДАЛОСЬ ЗАГРУЗИТЬ СЦЕНУ':'COULD NOT LOAD SCENE','СОЕДИНЕНИЕ С ГРАФИКОЙ ПРЕРВАНО':'GRAPHICS CONNECTION LOST','НЕ УДАЛОСЬ ОТКРЫТЬ СЦЕНУ':'COULD NOT OPEN SCENE'};
if(en){message.textContent=words[message.textContent]||message.textContent;retry.textContent='RETRY';}
const fail=text=>{panel.hidden=false;message.textContent=en?(words[text]||text):text;retry.hidden=false;};
const timeout=setTimeout(()=>{if(!ready)fail('ЗАГРУЗКА ЗАНИМАЕТ БОЛЬШЕ ВРЕМЕНИ, ЧЕМ ОБЫЧНО');},20000);
window.addEventListener('cloth-ready',()=>{ready=true;clearTimeout(timeout);panel.hidden=true;});
window.addEventListener('cloth-failed',event=>{clearTimeout(timeout);fail(event.detail||'НЕ УДАЛОСЬ ЗАГРУЗИТЬ СЦЕНУ');});
window.addEventListener('error',()=>{if(!ready){clearTimeout(timeout);fail('НЕ УДАЛОСЬ ЗАГРУЗИТЬ СЦЕНУ');}},true);
window.addEventListener('unhandledrejection',()=>{if(!ready){clearTimeout(timeout);fail('НЕ УДАЛОСЬ ЗАГРУЗИТЬ СЦЕНУ');}});
retry.addEventListener('click',()=>location.reload());})();
</script>
<script type="module" src="/src/main.tsx"></script>
</body></html>
